name = "ea-monitor"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ea-monitor"
database_id = "a808936c-7a8d-42a4-9c2f-94780d3dce91"

# R2 需在控制台先开通后再取消注释：
# [[r2_buckets]]
# binding = "LOGS"
# bucket_name = "ea-monitor-logs"

[triggers]
crons = ["* * * * *"]

[vars]
OFFLINE_AFTER_SECONDS = "180"
