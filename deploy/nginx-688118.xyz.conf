# Example nginx reverse proxy for 四季常春监控公益版 Node server
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/

# 放在 http {} 里：limit_req_zone $binary_remote_addr zone=ea_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 688118.xyz;

    # Redirect HTTP to HTTPS (uncomment after certbot)
    # return 301 https://$host$request_uri;

    location = /api/v1/login {
        limit_req zone=ea_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 150m;
    }
}

# After certbot, a second server block for 443 is added automatically.
# Ensure proxy_set_header X-Forwarded-Proto $scheme; is present so
# admin login cookies receive the Secure flag.
